<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mood Emoji</title>
  <style>
    /* === CSS: This is where we make things look pretty === */

    /* The whole page */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      transition: background-color 0.5s;
      padding: 30px 20px;
    }

    /* The big emoji */
    #emoji {
      font-size: 150px;
      margin-bottom: 10px;
    }

    /* The mood text */
    #mood-text {
      font-size: 32px;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    /* The row of mood buttons */
    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 15px;
    }

    /* Each mood button */
    .mood-btn {
      font-size: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.2s;
    }

    /* Make buttons bounce when you hover */
    .mood-btn:hover {
      transform: scale(1.1);
    }

    /* A different color for each button */
    .happy    { background-color: #FFD93D; color: #333; }
    .sleepy   { background-color: #6C5CE7; }
    .sad      { background-color: #74B9FF; }
    .angry    { background-color: #FF6B6B; }
    .excited  { background-color: #FF9FF3; }
    .cool     { background-color: #00D2D3; }
    .confused { background-color: #FF8C00; }

    /* The save button */
    #save-btn {
      font-size: 20px;
      padding: 15px 40px;
      border: 3px solid white;
      border-radius: 50px;
      background-color: rgba(255, 255, 255, 0.3);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      display: none;
    }

    #save-btn:hover {
      transform: scale(1.1);
      background-color: rgba(255, 255, 255, 0.5);
    }

    /* The saved message */
    #saved-msg {
      font-size: 18px;
      color: white;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      margin-bottom: 30px;
      height: 25px;
    }

    /* === Calendar styles === */

    .calendar-section {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 22px;
      color: #333;
    }

    .nav-btn {
      font-size: 24px;
      background: none;
      border: 2px solid #ddd;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background-color: #f0f0f0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .day-label {
      font-size: 14px;
      font-weight: bold;
      color: #999;
      padding: 5px;
    }

    .calendar-day {
      font-size: 14px;
      padding: 8px 4px;
      border-radius: 10px;
      min-height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .calendar-day.today {
      border: 2px solid #333;
    }

    .calendar-day .day-number {
      font-size: 12px;
      color: #999;
    }

    .calendar-day .day-emoji {
      font-size: 24px;
    }

    .empty-day {
      /* Empty days before the 1st of the month */
    }
  </style>
</head>
<body>

  <!-- === HTML: These are the building blocks === -->

  <div id="emoji">😊</div>
  <div id="mood-text">How are you feeling?</div>

  <div class="buttons">
    <button class="mood-btn happy"   onclick="changeMood('😊', 'Happy!',   '#FFD93D')">Happy</button>
    <button class="mood-btn sleepy"  onclick="changeMood('😴', 'Sleepy!',  '#6C5CE7')">Sleepy</button>
    <button class="mood-btn sad"     onclick="changeMood('😢', 'Sad!',     '#74B9FF')">Sad</button>
    <button class="mood-btn angry"   onclick="changeMood('😡', 'Angry!',   '#FF6B6B')">Angry</button>
    <button class="mood-btn excited" onclick="changeMood('🤩', 'Excited!', '#FF9FF3')">Excited</button>
    <button class="mood-btn cool"    onclick="changeMood('😎', 'Cool!',    '#00D2D3')">Cool</button>
    <button class="mood-btn confused" onclick="changeMood('😕', 'Confused!', '#FF8C00')">Confused</button>
  </div>

  <button id="save-btn" onclick="saveMood()">Save Today's Mood</button>
  <div id="saved-msg"></div>

  <!-- The calendar -->
  <div class="calendar-section">
    <div class="calendar-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
      <h2 id="calendar-title"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- === JavaScript: The magic that makes clicks do things === -->
  <script>
    // Keep track of the currently selected mood
    var currentEmoji = null;

    // Keep track of which month we're viewing
    var viewYear = new Date().getFullYear();
    var viewMonth = new Date().getMonth();

    function changeMood(emoji, text, color) {
      document.getElementById('emoji').textContent = emoji;
      document.getElementById('mood-text').textContent = text;
      document.body.style.backgroundColor = color;

      // Remember what was picked so we can save it
      currentEmoji = emoji;

      // Show the save button
      document.getElementById('save-btn').style.display = 'block';
      document.getElementById('saved-msg').textContent = '';
    }

    function saveMood() {
      if (!currentEmoji) return;

      // Get today's date as a simple string like "2026-02-07"
      var today = new Date();
      var dateKey = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');

      // Load any previously saved moods from localStorage
      var moods = JSON.parse(localStorage.getItem('moodHistory') || '{}');

      // Save today's emoji
      moods[dateKey] = currentEmoji;

      // Store it back in localStorage
      localStorage.setItem('moodHistory', JSON.stringify(moods));

      // Show a confirmation message
      document.getElementById('saved-msg').textContent = 'Mood saved! ' + currentEmoji;
      document.getElementById('save-btn').style.display = 'none';

      // Refresh the calendar to show the new mood
      drawCalendar();
    }

    function changeMonth(direction) {
      viewMonth += direction;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      } else if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      drawCalendar();
    }

    function drawCalendar() {
      var moods = JSON.parse(localStorage.getItem('moodHistory') || '{}');
      var today = new Date();

      // Month names for the title
      var monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      // Set the title
      document.getElementById('calendar-title').textContent =
        monthNames[viewMonth] + ' ' + viewYear;

      // Figure out the days in this month
      var firstDay = new Date(viewYear, viewMonth, 1).getDay();
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      // Build the calendar HTML
      var html = '';

      // Day labels (Sun, Mon, Tue, etc.)
      var dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      for (var i = 0; i < 7; i++) {
        html += '<div class="day-label">' + dayLabels[i] + '</div>';
      }

      // Empty spaces before the 1st
      for (var i = 0; i < firstDay; i++) {
        html += '<div class="empty-day"></div>';
      }

      // Each day of the month
      for (var day = 1; day <= daysInMonth; day++) {
        var dateKey = viewYear + '-' +
          String(viewMonth + 1).padStart(2, '0') + '-' +
          String(day).padStart(2, '0');

        var isToday = (day === today.getDate() &&
          viewMonth === today.getMonth() &&
          viewYear === today.getFullYear());

        var emoji = moods[dateKey] || '';

        html += '<div class="calendar-day' + (isToday ? ' today' : '') + '">';
        html += '<span class="day-number">' + day + '</span>';
        if (emoji) {
          html += '<span class="day-emoji">' + emoji + '</span>';
        }
        html += '</div>';
      }

      document.getElementById('calendar-grid').innerHTML = html;
    }

    // Draw the calendar when the page first loads
    drawCalendar();
  </script>

</body>
</html>
